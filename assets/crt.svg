<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1600"
  height="900"
  viewBox="0 0 1600 900"
>
  <defs>

    <!-- Horizontal CRT scanlines -->
    <pattern
      id="scanlines"
      width="4"
      height="8"
      patternUnits="userSpaceOnUse"
    >
      <rect
        width="4"
        height="4"
        fill="black"
        opacity="0"
      />

      <rect
        y="4"
        width="4"
        height="2"
        fill="black"
        opacity="0.18"
      />
    </pattern>

    <!-- Subtle screen glow -->
    <filter id="glow">
      <feGaussianBlur
        stdDeviation="1.5"
        result="blur"
      />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Screen vignette -->
    <radialGradient id="vignette">
      <stop
        offset="55%"
        stop-color="black"
        stop-opacity="0"
      />

      <stop
        offset="100%"
        stop-color="black"
        stop-opacity="0.55"
      />
    </radialGradient>

  </defs>

  <!-- Transparent screen -->
  <rect
    width="1600"
    height="900"
    fill="transparent"
  />

  <!-- Scanlines -->
  <rect
    width="1600"
    height="900"
    fill="url(#scanlines)"
  />

  <!-- Vignette -->
  <rect
    width="1600"
    height="900"
    fill="url(#vignette)"
  />

  <!-- Moving CRT scan bar -->
  <rect
    x="0"
    y="-100"
    width="1600"
    height="80"
    fill="white"
    opacity="0.025"
  >
    <animate
      attributeName="y"
      from="-100"
      to="900"
      dur="4s"
      repeatCount="indefinite"
    />
  </rect>

  <!-- Subtle flicker -->
  <rect
    width="1600"
    height="900"
    fill="white"
    opacity="0"
  >
    <animate
      attributeName="opacity"
      values="0;0.015;0;0.008;0"
      dur="0.15s"
      repeatCount="indefinite"
    />
  </rect>

</svg>
