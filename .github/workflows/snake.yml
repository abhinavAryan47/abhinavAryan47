name: Generate Contribution Snake + Profile Showcase

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#ffffff&color_dots=#111111,#3a3a3a,#666666,#999999,#eeeeee

      - name: Install image tooling
        run: pip install pillow

      - name: Generate skills and repositories CRT
        run: python scripts/skills_repositories_crt.py
        env:
          OUT_DIR: dist

      - name: Publish profile assets to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
